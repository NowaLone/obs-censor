MpcBeCensorFilter.Name=MPC-BE Censor
MpcBeCensorFilter.Url=MPC-BE URL (variables.html)
MpcBeCensorFilter.Url.Description=HTTP address of MPC-BE's variables.html page used to read the current playback time. Default: http://localhost:13579/variables.html. Leave empty to disable hiding.
MpcBeCensorFilter.PollInterval=Poll interval (ms)
MpcBeCensorFilter.PollInterval.Description=How often to query MPC-BE for the current playback time, in milliseconds. This affects trigger speed: a smaller value means less delay when the censor turns on. Range: 500–5000. Default: 1000.
MpcBeCensorFilter.Offset=Timing offset
MpcBeCensorFilter.Offset.Description=Use this when the actual playback time does not match the times listed in Timings. Shifts all ranges without editing the list. Formats: +/-HH:MM:SS or seconds (15, -15). + delays the trigger, − advances it. Example: +00:00:05 shows/hides 5 seconds later.
MpcBeCensorFilter.Timings=Timings
MpcBeCensorFilter.Timings.Description=Ranges when the source is visible, one per line. Formats: MM:SS-MM:SS or H:MM:SS-H:MM:SS. Spaces around "-" are optional. Notes after a range are ignored. Reversed ranges are swapped automatically.
