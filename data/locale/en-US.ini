MpcBeCensorFilter.Name="MPC-BE Censor"
MpcBeCensorFilter.Url="MPC-BE URL (variables.html)"
MpcBeCensorFilter.Url.Description="HTTP address of MPC-BE's variables.html page used to read the current playback time.\nDefault: http://localhost:13579/variables.html.\nLeave empty to disable hiding."
MpcBeCensorFilter.PollInterval="Poll interval (ms)"
MpcBeCensorFilter.PollInterval.Description="How often to query MPC-BE for the current playback time, in milliseconds.\nA smaller value means less delay when the censor turns on.\nRange: 500–5000. Default: 1000."
MpcBeCensorFilter.Offset="Timing offset"
MpcBeCensorFilter.Offset.Description="Use this when the actual playback time does not match the times listed in Timings.\nShifts all ranges without editing the list.\nFormats: +/-HH:MM:SS or seconds (15, -15).\n+ delays the trigger, − advances it.\nExample: +00:00:05 shows/hides 5 seconds later."
MpcBeCensorFilter.Timings="Timings"
MpcBeCensorFilter.Timings.Description="Ranges when the source is visible, one per line.\nFormats: MM:SS-MM:SS or H:MM:SS-H:MM:SS.\nSpaces around '-' are optional. Notes after a range are ignored.\nReversed ranges are swapped automatically."
