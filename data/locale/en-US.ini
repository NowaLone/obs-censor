MpcBeCensorFilter.Name=MPC-BE Censor
MpcBeCensorFilter.Url=MPC-BE URL
MpcBeCensorFilter.Url.Description=HTTP address of MPC-BE's variables.html page used to read the current playback time. Default: http://localhost:13579/variables.html. Leave empty to disable hiding.
MpcBeCensorFilter.Url.Help=Address of MPC-BE variables.html. Leave empty to disable hiding.
MpcBeCensorFilter.PollInterval=Poll (ms)
MpcBeCensorFilter.PollInterval.Description=How often to query MPC-BE for the current playback time, in milliseconds. A smaller value means less delay when the censor turns on. Range: 500–5000. Default: 1000.
MpcBeCensorFilter.PollInterval.Help=How often to poll MPC-BE, 500–5000 ms. Smaller is more responsive.
MpcBeCensorFilter.Offset=Offset
MpcBeCensorFilter.Offset.Description=Use this when the actual playback time does not match the times listed in Timings. Shifts all ranges without editing the list. Formats: +/-HH:MM:SS or seconds (15, -15). + delays the trigger, − advances it. Example: +00:00:05 shows/hides 5 seconds later.
MpcBeCensorFilter.Offset.Help=Offset format: +00:00:05, -00:00:05, or seconds (15, -15). + delays, − advances.
MpcBeCensorFilter.Timings=Timings
MpcBeCensorFilter.Timings.Description=Ranges when the source is visible, one per line. Formats: MM:SS-MM:SS or H:MM:SS-H:MM:SS. Spaces around the dash are optional. En-dashes and em-dashes from copied text are accepted. Notes after a range are ignored. Reversed ranges are swapped automatically.
MpcBeCensorFilter.Timings.Help=Format: 31:54 - 32:02 or 00:31:54-00:32:02. Spaces and any dash (-, –, —) are fine. Text after a range is ignored.
