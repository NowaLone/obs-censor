MpcBeCensorFilter.Name="MPC-BE Цензор"
MpcBeCensorFilter.Url="URL MPC-BE (variables.html)"
MpcBeCensorFilter.Url.Description="HTTP-адрес страницы variables.html в MPC-BE, откуда читается текущее время воспроизведения.\nПо умолчанию: http://localhost:13579/variables.html.\nПустое поле отключает скрытие источника."
MpcBeCensorFilter.PollInterval="Интервал опроса (мс)"
MpcBeCensorFilter.PollInterval.Description="Как часто опрашивать MPC-BE о текущем времени, в миллисекундах.\nЧем меньше значение, тем меньше задержка при включении заглушки.\nДиапазон: 500–5000. По умолчанию: 1000."
MpcBeCensorFilter.Offset="Сдвиг таймингов"
MpcBeCensorFilter.Offset.Description="Нужен, если фактический хронометраж в плеере отличается от указанного в таймингах.\nСдвигает все интервалы, не меняя список.\nФорматы: +/-ЧЧ:ММ:СС или секунды (15, -15).\n+ задерживает срабатывание, − ускоряет.\nПример: +00:00:05 — источник меняет состояние на 5 секунд позже."
MpcBeCensorFilter.Timings="Тайминги"
MpcBeCensorFilter.Timings.Description="Интервалы, в которых источник виден, по одному на строку.\nФорматы: ММ:СС-ММ:СС или Ч:ММ:СС-Ч:ММ:СС.\nПробелы вокруг «-» не обязательны. Текст после диапазона игнорируется.\nПеревёрнутые диапазоны исправляются автоматически."
