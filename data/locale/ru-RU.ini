MpcBeCensorFilter.Name=MPC-BE Цензор
MpcBeCensorFilter.Url=URL MPC-BE (variables.html)
MpcBeCensorFilter.Url.Description=HTTP-адрес страницы variables.html в MPC-BE, откуда читается текущее время воспроизведения. По умолчанию: http://localhost:13579/variables.html. Пустое поле отключает скрытие источника.
MpcBeCensorFilter.PollInterval=Интервал опроса (мс)
MpcBeCensorFilter.PollInterval.Description=Как часто опрашивать MPC-BE о текущем времени, в миллисекундах. Влияет на скорость срабатывания: чем меньше значение, тем меньше задержка при включении заглушки. Диапазон: 500–5000. По умолчанию: 1000.
MpcBeCensorFilter.Offset=Сдвиг таймингов
MpcBeCensorFilter.Offset.Description=Нужен, если фактический хронометраж в плеере отличается от указанного в таймингах. Сдвигает все интервалы, не меняя список. Форматы: +/-ЧЧ:ММ:СС или секунды (15, -15). + задерживает срабатывание, − ускоряет. Пример: +00:00:05 — источник меняет состояние на 5 секунд позже.
MpcBeCensorFilter.Timings=Тайминги
MpcBeCensorFilter.Timings.Description=Интервалы, в которых источник виден, по одному на строку. Форматы: ММ:СС-ММ:СС или Ч:ММ:СС-Ч:ММ:СС. Пробелы вокруг «-» не обязательны. Текст после диапазона игнорируется. Перевёрнутые диапазоны исправляются автоматически.
