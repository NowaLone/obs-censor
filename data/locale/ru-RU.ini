MpcBeCensorFilter.Name=МPC-BE Цензор
MpcBeCensorFilter.Url=URL MPC-BE
MpcBeCensorFilter.Url.Description=HTTP-адрес страницы variables.html в MPC-BE, откуда читается текущее время воспроизведения. По умолчанию: http://localhost:13579/variables.html. Пустое поле отключает скрытие источника.
MpcBeCensorFilter.Url.Help=Адрес variables.html в MPC-BE. Пустое поле отключает скрытие.
MpcBeCensorFilter.PollInterval=Опрос (мс)
MpcBeCensorFilter.PollInterval.Description=Как часто опрашивать MPC-BE о текущем времени, в миллисекундах. Влияет на скорость срабатывания: чем меньше значение, тем меньше задержка при включении заглушки. Диапазон: 500–5000. По умолчанию: 1000.
MpcBeCensorFilter.PollInterval.Help=Как часто опрашивать MPC-BE, 500–5000 мс. Меньше — быстрее реакция.
MpcBeCensorFilter.Offset=Сдвиг
MpcBeCensorFilter.Offset.Description=Нужен, если фактический хронометраж в плеере отличается от указанного в таймингах. Сдвигает все интервалы, не меняя список. Форматы: +/-ЧЧ:ММ:СС или секунды (15, -15). + задерживает срабатывание, − ускоряет. Пример: +00:00:05 — источник меняет состояние на 5 секунд позже.
MpcBeCensorFilter.Offset.Help=Формат сдвига: +00:00:05, -00:00:05 или секунды (15, -15). + задерживает, − ускоряет.
MpcBeCensorFilter.Timings=Тайминги
MpcBeCensorFilter.Timings.Description=Интервалы, в которых источник виден, по одному на строку. Форматы: ММ:СС-ММ:СС или Ч:ММ:СС-Ч:ММ:СС. Пробелы вокруг тире не обязательны. Длинное тире из скопированного текста принимается. Текст после диапазона игнорируется. Перевёрнутые диапазоны исправляются автоматически.
MpcBeCensorFilter.Timings.Help=Формат: 31:54 - 32:02 или 00:31:54-00:32:02. Пробелы и любое тире (-, –, —) допустимы. Текст после диапазона игнорируется.
